version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: smart-leads-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: smart_leads
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: smart-leads-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/smart_leads?authSource=admin
      JWT_SECRET: your_super_secret_jwt_key_change_this
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: smart-leads-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:   